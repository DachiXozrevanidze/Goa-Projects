<!-- 5)შექმენი div, შიგნით ჩაწერე მოკლე ტექსტი, ქვემოთ კი შექმენი table, 
 რომელსაც ექნება  ორი სველი: ცხოველი, ფაქტი. ეს ყველაფერი უნდა იყოს div-ის შიგნით -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div style="padding: 20px; border: 1px solid black; width: 300px;">

    <p>ეს არის მოკლე ინფორმაცია ცხოველების შესახებ.</p>

    <table border="1" style="width: 100%; margin-top: 10px;">
        <tr>
            <th>ცხოველი</th>
            <th>ფაქტი</th>
        </tr>

        <tr>
            <td>ლომი</td>
            <td>მეფედ ითვლება აფრიკაში</td>
        </tr>

        <tr>
            <td>ლეოპარდი</td>
            <td>ძალიან სწრაფად დარბის</td>
        </tr>
    </table>

</div>
</body>
</html>
